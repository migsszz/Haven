<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Haven</title>
  <meta name="description" content="Haven: a demo online store built with Angular, Flask, and PostgreSQL.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved design and light/dark choice before the first paint, so there is no flash of the wrong
    // look. This is the same rule as ThemeService (src/app/core/theme.service.ts); keep the two in step.
    try {
      var design = JSON.parse(localStorage.getItem('haven.design'));
      var mode = JSON.parse(localStorage.getItem('haven.theme'));
      design = design === 'friendly' || design === 'bold' ? design : 'editorial';
      var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-design', design);
      document.documentElement.setAttribute('data-theme', (design === 'editorial' ? 'haven' : design) + (dark ? '-dark' : ''));
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
