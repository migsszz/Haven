name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: haven_test
          POSTGRES_USER: haven
          POSTGRES_PASSWORD: haven
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haven -d haven_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://haven:haven@localhost:5432/haven_test

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  deploy:
    name: Build images and deploy to AWS
    needs: [api, web]
    # Skipped until the AWS variables are configured (see README, "Deploying to AWS").
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_REGION != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub assume the AWS role without long-lived keys
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          IMAGE_PREFIX: ${{ steps.ecr.outputs.registry }}/haven
        run: |
          for svc in api web; do
            docker build -t "$IMAGE_PREFIX-$svc:$IMAGE_TAG" -t "$IMAGE_PREFIX-$svc:latest" "./$svc"
            docker push --all-tags "$IMAGE_PREFIX-$svc"
          done

      - name: Copy compose file and database scripts to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml,api/db
          target: ~/haven

      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,AWS_REGION,IMAGE_TAG
          script: |
            set -e
            cd ~/haven
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
            export IMAGE_PREFIX="$REGISTRY/haven" IMAGE_TAG
            docker compose pull api web
            docker compose up -d --no-build
            docker image prune -f
