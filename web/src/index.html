<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Haven</title>
  <meta name="description" content="Haven: a demo online store built with Angular, Flask, and PostgreSQL.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply a saved light/dark choice before the first paint, so there is no flash of the wrong theme.
    try {
      var saved = JSON.parse(localStorage.getItem('haven.theme'));
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'haven-dark' : 'haven');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
