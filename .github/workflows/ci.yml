name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The "Run workflow" button on the Actions tab. Pick the main branch there. Optionally give the full ID of an
  # older commit to put it back (a rollback). The tests run first either way.
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit ID (40 characters), tag, or branch to deploy. Leave empty for the latest main.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: haven_test
          POSTGRES_USER: haven
          POSTGRES_PASSWORD: haven
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haven -d haven_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://haven:haven@localhost:5432/haven_test

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check:contrast
      - run: npx ng test --watch=false
      - run: npx ng build

  deploy:
    name: Build images and deploy to AWS
    needs: [api, web]
    # Runs on a push to main, or when started by hand from main. Skipped until the AWS variables are configured
    # (see README, "Deploying to AWS"). It has to be main: the AWS role only trusts that branch.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main' && vars.AWS_REGION != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub assume the AWS role without long-lived keys
    # Never two deploys at once; a second one waits for the first to finish.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Tag the images with the commit that was actually checked out, which differs from the workflow's own
      # commit when an older ref is being deployed.
      - name: Work out what is being deployed
        run: |
          echo "IMAGE_TAG=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Deploying $(git log -1 --format='%h %s')" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          IMAGE_PREFIX: ${{ steps.ecr.outputs.registry }}/haven
        run: |
          for svc in api web; do
            docker build -t "$IMAGE_PREFIX-$svc:$IMAGE_TAG" -t "$IMAGE_PREFIX-$svc:latest" "./$svc"
            docker push --all-tags "$IMAGE_PREFIX-$svc"
          done

      - name: Copy compose file and database scripts to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml,api/db
          target: ~/haven

      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,AWS_REGION,IMAGE_TAG
          script: |
            set -e
            cd ~/haven
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
            export IMAGE_PREFIX="$REGISTRY/haven" IMAGE_TAG
            docker compose pull api web
            docker compose up -d --no-build
            docker image prune -f
